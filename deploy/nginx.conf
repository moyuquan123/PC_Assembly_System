map $uri $privacy_safe_uri {
  ~^/builds/[A-Za-z0-9_-]+$ /builds/:shareCode;
  ~^/api/v1/builds/[A-Za-z0-9_-]+$ /api/v1/builds/:shareCode;
  default $uri;
}

log_format privacy '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $privacy_safe_uri $server_protocol" $status $body_bytes_sent '
                   '"$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log privacy;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

  location /api/ {
    proxy_pass http://api:4174;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health/ {
    proxy_pass http://api:4174;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
